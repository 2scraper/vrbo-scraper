name: canary

# tests.yml (deliberately) never touches vrbo.com — see its own header for
# why. That leaves a real gap: a markup change on the site only shows up when
# a user hits it and files an issue, while the offline badge stays green
# throughout. This workflow is the other half: real runs against a real
# search URL, so a site-side break is caught here first.
#
# A canary that did not reach the data does not end green. Two jobs:
#
#   first-page   No secret. Real Chrome, headful under xvfb, from the bare
#                runner. Page 1 yielded rows to the runner on 14 of the 20
#                scheduled runs from 2026-09-25 to 2026-10-15 (4 blocked, 1
#                served the site's error page), so this job runs ungated and REQUIRES rows: a
#                block (exit 3), a page served without its results (exit 5),
#                zero rows or a parser shortfall is red. One re-run after a
#                pause is allowed on exit 3, because the refusal here is a
#                rate response that has been measured clearing.
#
#   pagination   Needs the VRBO_PROXY secret, and FAILS naming it when the
#                secret is absent. The page turn's data comes over POST
#                /graphql, and from the runner's address it was answered HTTP
#                429 on all 13 of those runs that pressed next (exit 6,
#                next_page_throttled), so the walk can only be tested from
#                another exit:
#
#                    gh secret set VRBO_PROXY --repo 2scraper/vrbo-scraper
#
# The secret reaches the scraper through the ENVIRONMENT, which env_config.py
# reads for exactly this variable, never through a --proxy flag: a credential
# on a command line is readable by anything that can run `ps`.
#
# The stay dates are computed from the run date (45 and 47 days out) rather
# than pinned: a pinned date drifts towards the present, inventory for it
# thins out (15 properties on 2026-10-15 for a stay a month away) and then it
# becomes a past stay, which changes what the canary measures on a calendar
# date instead of on a code change.
#
# The assertions live in .github/canary_check.py and test the PARSER: core
# columns on every row, a low row floor, the run's own status. Not
# merchandising shares and not the day's inventory.

on:
  schedule:
    # 06:20 UTC. Off the hour, because everything else in the world runs on
    # it and a queued runner adds nothing but latency.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-page:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the client and REAL CHROME
        # `chrome`, not `chromium`: it matches the engine's default channel,
        # so CI exercises what a user runs.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chrome
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Scrape page 1 of a dated search, from the bare runner
        id: run
        # set +e so the exit code can be read; the verdict step decides.
        run: |
          set +e
          start=$(date -u -d '+45 days' +%F)
          end=$(date -u -d '+47 days' +%F)
          url="https://www.vrbo.com/search?destination=Orlando%2C%20Florida%2C%20United%20States%20of%20America&regionId=2693&sort=RECOMMENDED&startDate=${start}&endDate=${end}&adults=2"
          echo "Stay ${start} to ${end}"
          for attempt in 1 2; do
            xvfb-run -a python3 playwright_scraper.py --url "$url" \
              --pages 1 --retries 4 \
              --out canary_run --dump-html canary_run.html
            code=$?
            [ "$code" != "3" ] && break
            [ "$attempt" = "1" ] && echo "Blocked (exit 3); waiting 120s and trying once more." && sleep 120
          done
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Require rows
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          case "$code" in
            0) echo "Rows written; checking them next." ;;
            3) echo "::error::Blocked (exit 3) twice from the runner's address. Nothing was tested today. Page 1 usually yields rows to a runner (14 of 20 scheduled runs, 2026-09-25 to 10-15); if this repeats, the refusal has changed." ; exit 1 ;;
            4) echo "::error::Exit 4: the site's own no-results answer for a dated Orlando search, which holds dozens of properties. Read the HTML dump in the artefacts." ; exit 1 ;;
            5) echo "::error::Exit 5: page 1 was not obtained (load failure, a page served without its results such as the site's own error copy, or a grid the parser read as 0 rows). The sidecar is not written on a failed run; the debug dump in the artefacts shows what the browser had." ; exit 1 ;;
            6) echo "::error::Exit 6 on a one-page run: the page was partial. See cards_missing in the sidecar." ; exit 1 ;;
            *) echo "::error::Unexpected exit code $code (see the step above)." ; exit 1 ;;
          esac

      - name: Check the parser on what was served
        run: python3 .github/canary_check.py --prefix canary_run --pages 1

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-first-page-${{ github.run_id }}
          path: |
            canary_run.json
            canary_run.csv
            canary_run.meta.json
            canary_run.html*
            canary_run_page*_debug.*
          if-no-files-found: ignore
          retention-days: 14

  pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VRBO_PROXY: ${{ secrets.VRBO_PROXY }}
    steps:
      - name: Require the VRBO_PROXY secret
        # Not a skip: a skipped pagination check reads exactly like a passing
        # one, and from the runner's own address the page turn has been
        # refused on every scheduled run that pressed next.
        run: |
          if [ -z "$VRBO_PROXY" ]; then
            echo "::error::The VRBO_PROXY secret is not set, so pagination was NOT tested. From a GitHub runner's address the page turn was answered HTTP 429 on all 13 scheduled runs that pressed next (2026-09-25 to 10-15). Add a residential exit: gh secret set VRBO_PROXY --repo 2scraper/vrbo-scraper"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the client and REAL CHROME
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chrome
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Walk three pages through the proxy
        id: run
        # Three pages, not two: one turn only proves the button was found
        # once; the second turn is where a cursor that does not advance shows
        # up. --delay 15 because the turn's /graphql POST is rate limited
        # separately from the HTML.
        run: |
          set +e
          start=$(date -u -d '+45 days' +%F)
          end=$(date -u -d '+47 days' +%F)
          url="https://www.vrbo.com/search?destination=Orlando%2C%20Florida%2C%20United%20States%20of%20America&regionId=2693&sort=RECOMMENDED&startDate=${start}&endDate=${end}&adults=2"
          xvfb-run -a python3 playwright_scraper.py --url "$url" \
            --pages 3 --delay 15 --retries 4 \
            --out canary_walk --dump-html canary_walk.html
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Require a complete walk
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::error::The three-page walk through VRBO_PROXY exited $code (3 blocked, 5 not obtained, 6 partial: see stop_reason in canary_walk.meta.json). Pagination was not verified."
            exit 1
          fi

      - name: Check the parser across the walk
        run: python3 .github/canary_check.py --prefix canary_walk --pages 3

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-pagination-${{ github.run_id }}
          path: |
            canary_walk.json
            canary_walk.csv
            canary_walk.meta.json
            canary_walk.html*
            canary_walk_page*_debug.*
          if-no-files-found: ignore
          retention-days: 14
