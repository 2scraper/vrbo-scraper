name: Bug report
description: The scraper ran but the result was wrong, empty, or it crashed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before anything else: never paste an API key, a proxy password or a
        full `ws://user:pass@...` endpoint into a public issue.** The scrapers
        mask credentials in their own logs, but raw HTML dumps and the Scraper
        API's `x-debug` header do not. Replace them with `***`.

        A few things answer most reports faster than we can:

        - **Everything exit 3?** That is Expedia's "Bot or Not?" handler
          (HTTP 429) refusing your exit address, and the scoring is noisy:
          the same address serves some requests and challenges others
          minutes apart. Slow down (`--delay 10`), move to another exit
          (`--proxy` / `--proxy-file`), or wait. The log names the vendor
          the handler picked, e.g. `blocked (datadome-challenge)`; only a
          reCAPTCHA pick is ever offered to the solver.
        - **Exit 6 after page 1?** Look at `stop_reason` in the sidecar.
          `next_page_throttled` means the page turn (`POST /graphql`) was
          rate limited while the HTML kept answering 200; `cards_missing`
          means a page delivered fewer cards than its own counter states.
        - **Every price changed overnight?** Check `stay_dates`. A search
          with no dates in the URL prices each property on its own cheapest
          night; pin `startDate`/`endDate` for comparable prices.
        - **`image_url` or `amenities` empty on most rows?** Expected: the
          gallery is not mounted below the fold, and the amenity strip is an
          A/B variant of the card.
        - **Zero rows?** See
          [TROUBLESHOOTING.md](../blob/main/TROUBLESHOOTING.md) first.
        - **Wrong currency or language?** The storefront is the hostname
          (`vrbo.com`, `fewo-direkt.de`, `abritel.fr`, `bookabach.co.nz`,
          `stayz.com.au`), not something the exit IP decides.

  - type: dropdown
    id: engine
    attributes:
      label: Which engine
      options:
        - playwright_scraper.py
        - puppeteer_scraper.py
        - selenium_scraper.py
        - scraper_api_client.py
        - fingerprint_client.py
        - other / not sure
    validations:
      required: true

  - type: dropdown
    id: browser_route
    attributes:
      label: How was the browser reached
      options:
        - A browser the script launched itself
        - A remote browser over --cdp-endpoint
        - No browser (scraper_api_client.py over plain HTTP)
        - Not applicable
    validations:
      required: true

  - type: input
    id: exit_code
    attributes:
      label: Exit code
      description: >-
        `echo $?` straight after the run. These mean specific things — 3 is a
        challenge page, 4 is "ran fine, found nothing", 124 is a self-imposed
        timeout. The table is in the README.
      placeholder: "4"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The exact command
      description: With credentials replaced by `***`.
      render: shell
      placeholder: |
        python3 playwright_scraper.py \
          --url "https://www.vrbo.com/search?destination=Orlando,%20Florida,%20United%20States%20of%20America" \
          --pages 2 --out orlando
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The whole run, not just the last line — the useful detail is usually
        upstream of the error. Credentials replaced by `***`.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: >-
        50 properties per page, as the README says a search page holds.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run and paste:
        ```
        python3 -c "import sys, platform; print(sys.version, platform.platform())"
        pip list 2>/dev/null | grep -Ei "playwright|pyppeteer|selenium|beautifulsoup4|requests|webdriver"
        python3 smoke_test.py | tail -3
        ```
      render: text
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: The offline suite passes on my machine (`python3 smoke_test.py`)
          required: true
        - label: I removed every API key, password and credentialled URL from this report
          required: true
